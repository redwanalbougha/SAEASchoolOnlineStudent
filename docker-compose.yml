version: "3.9"
services:
  react-app:
    build:
      context: ./react-hello-world
      dockerfile: Dockerfile
    env_file:
      - react-hello-world/.env
    ports:
      - "3000:80"
    restart: unless-stopped

  java-app:
    build:
      context: ./java-hello-world
      dockerfile: Dockerfile
    environment:
      JAVA_MESSAGE: "Hello from Docker Compose, test 123"
    tty: true
    restart: "no"
