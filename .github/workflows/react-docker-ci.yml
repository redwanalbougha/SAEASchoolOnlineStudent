name: React Hello World Docker CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'react-hello-world/**'
      - '.github/workflows/react-docker-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'react-hello-world/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build React Docker image
      run: docker build -t react-hello-world:ci react-hello-world

    - name: Run React Docker container and verify content
      run: |
        set -e
        docker run --rm -d --name react-docker-ci -p 8080:80 --env-file react-hello-world/.env react-hello-world:ci
        sleep 5
        curl -fsSL http://127.0.0.1:8080 | grep 'Hello from Docker env file'
        docker stop react-docker-ci
